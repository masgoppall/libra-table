[package]
name = "libratable"
version = "0.4.0"
description = "LibraTable — a fast, safe desktop database client"
edition = "2021"
rust-version = "1.82"

[lib]
name = "libratable_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-clipboard-manager = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
url = "2"
hex = "0.4"
csv = "1"
log = "0.4"
aes-gcm = "0.10"
# TablePlus connection exports (RNCryptor v3: AES-256-CBC, PBKDF2-SHA1, HMAC-SHA256).
aes = "0.8"
cbc = "0.1"
plist = "1"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
subtle = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }

sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "mysql",
  "sqlite",
  "chrono",
  "uuid",
  "json",
  "rust_decimal",
] }
rust_decimal = "1"
# Same version sqlx links, used only for sqlite3_interrupt.
libsqlite3-sys = "0.30"

russh = "0.45"
russh-keys = "0.45"
async-trait = "0.1"
# known_hosts maintenance (hashed `|1|salt|hash` entries).
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"

keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
sqlparser = "0.52"

# Cloud drivers (Snowflake, BigQuery, DynamoDB) over HTTPS. ring signs the BigQuery
# service-account JWT (already linked by rustls); flate2 unpacks Snowflake result chunks.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ring = "0.17"
flate2 = "1"
# Redis: tokio + rustls (no OpenSSL); 0.32 keeps the crate's rust-version at 1.82.
redis = { version = "0.32", default-features = false, features = [
  "aio",
  "tokio-comp",
  "tokio-rustls-comp",
  "tls-rustls-insecure",
  "connection-manager",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Places the window buttons and resizes the window in one step (already linked by Tauri).
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSButton",
  "NSControl",
  "NSResponder",
  "NSScreen",
  "NSView",
  "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }
# Asks the keychain whether a secret exists without reading it (no access prompt).
security-framework = "3"

[dev-dependencies]
tempfile = "3"
# Throwaway RSA keys for the BigQuery JWT tests.
rsa = "0.9"

[profile.release]
codegen-units = 1
lto = true
strip = true

# Key derivation is deliberately slow; keep it fast enough in debug builds and tests.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.sha1]
opt-level = 3
# RSA key generation in the BigQuery tests.
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3
